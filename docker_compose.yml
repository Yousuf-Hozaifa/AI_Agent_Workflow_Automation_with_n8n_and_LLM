version: "3.9"

services:
  # ── FastAPI lead handler ────────────────────────────────────────────────────
  api:
    build: ./backend
    container_name: lead_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/lead-inbound
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SENDER=${SMTP_SENDER:-leads@example.com}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      - n8n
    networks:
      - lead_net

  # ── n8n workflow engine ─────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: lead_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-changeme}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Dhaka
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    networks:
      - lead_net

networks:
  lead_net:
    driver: bridge

volumes:
  n8n_data: